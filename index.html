<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HR Recruitment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:wght@600&family=Noto+Sans+SC:wght@400;700&display=swap">
<style>
:root{
  --bg:#F6F5F1;--surface:#FFFFFF;--surface-2:#FAF9F6;--line:#E4E2DB;--line-2:#D8D6CE;
  --ink:#1B1D1C;--ink-2:#3E4341;--muted:#5B605D;
  --accent:#0F5E5A;--accent-ink:#FFFFFF;--accent-soft:#E3EFED;--accent-line:#9DB9B4;
  --side:#14302E;--side-ink:#C9DAD6;--side-active:#1F4A46;--side-strong:#FFFFFF;--side-sub:#A9C3BE;
  --warn:#8A4209;--warn-soft:#FBEBDD;--bad:#A12B2B;--bad-soft:#F8E3E1;--bad-line:#E8C4C0;
  --info:#1F4E8C;--info-soft:#E4ECF7;--purple:#6B4FA0;--purple-soft:#EEE8F7;
  --paper:#FFFFFF;--hl:#FFF4C9;
  --shadow:0 1px 2px rgba(20,48,46,.06);
  --sans:'Be Vietnam Pro','Noto Sans SC',system-ui,-apple-system,'Segoe UI',sans-serif;
  --serif:Lora,'Noto Sans SC',Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#111615;--surface:#1A2120;--surface-2:#151B1A;--line:#2A3331;--line-2:#36403E;
  --ink:#E8ECEA;--ink-2:#C5CCC9;--muted:#98A29E;
  --accent:#5FB8AF;--accent-ink:#0B1F1D;--accent-soft:#16312E;--accent-line:#2F5C57;
  --side:#0C1A19;--side-ink:#A9C3BE;--side-active:#1A3835;--side-strong:#FFFFFF;--side-sub:#86A39E;
  --warn:#E0A36B;--warn-soft:#33261A;--bad:#EB8C85;--bad-soft:#3A1F1D;--bad-line:#5A2E2B;
  --info:#8DB4EA;--info-soft:#1B2A3D;--purple:#B9A2E6;--purple-soft:#2A2240;
  --paper:#1E2625;--hl:#3A3419;--shadow:none;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111615;--surface:#1A2120;--surface-2:#151B1A;--line:#2A3331;--line-2:#36403E;
  --ink:#E8ECEA;--ink-2:#C5CCC9;--muted:#98A29E;
  --accent:#5FB8AF;--accent-ink:#0B1F1D;--accent-soft:#16312E;--accent-line:#2F5C57;
  --side:#0C1A19;--side-ink:#A9C3BE;--side-active:#1A3835;--side-strong:#FFFFFF;--side-sub:#86A39E;
  --warn:#E0A36B;--warn-soft:#33261A;--bad:#EB8C85;--bad-soft:#3A1F1D;--bad-line:#5A2E2B;
  --info:#8DB4EA;--info-soft:#1B2A3D;--purple:#B9A2E6;--purple-soft:#2A2240;
  --paper:#1E2625;--hl:#3A3419;--shadow:none;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 20px}
.brand-mark{width:36px;height:36px;border-radius:10px;background:#E3EFED;color:#0F5E5A;display:grid;place-items:center;flex-shrink:0}
.brand b{display:block;color:var(--side-strong);font-size:17px}
.brand small{color:var(--side-sub);font-size:12px}
.nav{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:8px;color:var(--side-ink);text-decoration:none;font-size:14px}
.nav:hover{background:rgba(255,255,255,.05);color:var(--side-strong)}
.nav[aria-current="page"]{background:var(--side-active);color:var(--side-strong);font-weight:600}
.nav .count{margin-left:auto;font-size:11px;font-weight:700;background:rgba(255,255,255,.1);padding:1px 7px;border-radius:9px}
.side-foot{margin-top:auto;padding:12px;border-radius:10px;background:rgba(255,255,255,.05);font-size:12px;color:var(--side-sub);line-height:1.5}
.side-foot b{color:var(--side-strong);font-weight:600}
main{padding:24px 28px 40px;display:flex;flex-direction:column;gap:18px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.top h1{font-family:var(--serif);font-size:27px;font-weight:600;line-height:1.2}
.top p{color:var(--muted);margin-top:4px;max-width:70ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.pad{padding:18px 20px}
.card h2{font-size:15px;font-weight:600}
.sub{font-size:12px;color:var(--muted)}
.label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.btn{min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:600;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent-line)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad-line)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:32px;padding:0 10px;font-size:12px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);display:inline-grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.icon-btn:hover{border-color:var(--accent-line);color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:12px;font-weight:500;color:var(--ink-2)}
.input,select.input,textarea.input{width:100%;min-height:40px;padding:8px 12px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);font-size:13px}
textarea.input{line-height:1.6;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap}
.t-info{background:var(--info-soft);color:var(--info)}
.t-warn{background:var(--warn-soft);color:var(--warn)}
.t-accent{background:var(--accent-soft);color:var(--accent)}
.t-bad{background:var(--bad-soft);color:var(--bad)}
.t-purple{background:var(--purple-soft);color:var(--purple)}
.t-ink{background:var(--ink);color:var(--bg)}
.t-muted{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.lang{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.lang code{min-width:26px;height:20px;padding:0 5px;border-radius:5px;border:1px solid currentColor;font:700 11px var(--sans);display:inline-grid;place-items:center}
.l-vi{color:var(--ink-2)}.l-en{color:var(--info)}.l-zh{color:var(--warn)}.l-other{color:var(--muted)}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);gap:2px}
.seg button{min-height:34px;padding:0 12px;border:0;border-radius:8px;background:transparent;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line-2);background:var(--surface);font-size:13px;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:600}
.tag button{border:0;background:transparent;color:inherit;cursor:pointer;padding:0 0 0 2px;font-size:14px;line-height:1}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.kpi b{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi span{font-size:13px;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters .input{width:auto;min-height:36px;padding:4px 10px}
.search{min-width:220px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:980px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0}
.who b{display:block;font-weight:600}
.who small{display:block;font-size:12px;color:var(--muted);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score{display:flex;align-items:center;gap:8px;min-width:110px}
.score b{width:28px;font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.c-accent{color:var(--accent)}.c-warn{color:var(--warn)}.c-bad{color:var(--bad)}.c-muted{color:var(--muted)}
.bg-accent{background:var(--accent)}.bg-warn{background:var(--warn)}.bg-bad{background:var(--bad)}.bg-muted{background:var(--line-2)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.sample-badge{font-size:10px;font-weight:700;letter-spacing:.04em;padding:1px 6px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--muted);margin-left:6px;vertical-align:middle}
/* upload */
.upload{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:stretch}
.drop{border:1.5px dashed var(--accent-line);background:var(--accent-soft);border-radius:12px;display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer;color:var(--accent);position:relative}
.drop.over{border-style:solid;filter:brightness(.97)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop strong{display:block;font-size:14px}
.drop span{font-size:12px;color:var(--ink-2)}
.uplog{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.uplog div{display:flex;gap:8px;align-items:center;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot.run{background:var(--warn);animation:pulse 1.2s infinite}
.dot.ok{background:var(--accent)}.dot.err{background:var(--bad)}
@keyframes pulse{50%{opacity:.3}}
details summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:600}
/* cv */
.cv-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
.paper{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:28px 32px;white-space:pre-wrap;font-size:13.5px;line-height:1.7;max-height:70vh;overflow:auto;font-family:var(--sans)}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:10px;font-size:13px}
.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.ring>div{width:76px;height:76px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.ring small{font-size:11px;color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.kv b{font-weight:500;text-align:right;overflow-wrap:anywhere}
ul.list{margin:0;padding-left:18px;font-size:13px;line-height:1.7}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.mini-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mini{padding:10px 12px;border-radius:8px;background:var(--surface-2);display:flex;flex-direction:column;gap:2px}
.mini span{font-size:12px;color:var(--muted)}
.mini b{font-size:14px}
.brk{display:grid;grid-template-columns:150px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px}
.thinking{display:flex;gap:12px;align-items:center;padding:16px 18px;border-radius:12px;background:var(--warn-soft);color:var(--warn)}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .9s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
/* pipeline */
.board{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:240px}
.col-head{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 6px;font-weight:600}
.col-head i{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.kcard .nm{font-weight:600;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--ink)}
.kcard .nm:hover{color:var(--accent);text-decoration:underline}
/* interview */
.iv-grid{display:grid;grid-template-columns:280px minmax(0,1fr);gap:18px;align-items:start}
.iv-list button{width:100%;text-align:left;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:4px}
.iv-list button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.rtabs{display:grid;gap:12px}
.rtab{text-align:left;padding:12px 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);display:flex;align-items:center;gap:12px;cursor:pointer}
.rtab[aria-pressed="true"]{border-color:var(--accent);background:var(--surface)}
.rnum{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--line);color:var(--ink-2);flex-shrink:0}
.rtab[aria-pressed="true"] .rnum{background:var(--accent);color:var(--accent-ink)}
.iv-body{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;align-items:start}
.crit{display:grid;grid-template-columns:minmax(120px,1.1fr) auto minmax(140px,1.6fr);gap:12px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.pills{display:flex;gap:4px}
.pills button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);font-weight:700;font-size:13px;cursor:pointer}
.pills button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.person{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.final{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:16px 20px;border-radius:12px;border:1px solid var(--line)}
.verdicts button{min-height:38px;padding:0 14px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;cursor:pointer}
/* jobs */
.jobs-grid{display:grid;grid-template-columns:260px minmax(0,1fr) 300px;gap:16px;align-items:start}
.job-item{width:100%;text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:6px}
.job-item[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.aipanel{background:var(--side);color:var(--side-ink);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px}
.aipanel h2{color:var(--side-strong)}
.aipanel .btn{background:#E3EFED;color:#0F5E5A;border-color:#E3EFED}
input[type=range]{width:100%;accent-color:var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:500;max-width:min(560px,calc(100% - 32px));z-index:10;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:10px;background:var(--bad-soft);color:var(--bad);font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:1180px){
  .jobs-grid{grid-template-columns:240px minmax(0,1fr)}
  .jobs-grid>.ai-col{grid-column:1/-1}
  .iv-body{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:980px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;overflow-x:auto;padding:8px 12px;gap:4px;z-index:5}
  .brand{padding:0 8px 0 0}.brand small,.side-foot{display:none}
  .nav{white-space:nowrap;min-height:40px}
  main{padding:18px 16px 40px}
  .cv-grid,.iv-grid,.jobs-grid,.upload{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .grid2,.mini-grid{grid-template-columns:minmax(0,1fr)}
  .crit{grid-template-columns:minmax(0,1fr)}
  .brk{grid-template-columns:110px minmax(0,1fr) 40px}
  .paper{padding:18px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body{margin:0}[hidden]{display:none!important}img{max-width:100%}
</style>
</head>

      <div><b>HR Recruitment</b><small>Tuyển dụng thông minh</small></div>

async function pdfDoc(file){
  if (!window.pdfjsLib) throw new Error('pdf');
  const buf = await file.arrayBuffer();

}
async function pdfText(pdf){
  let out = [];
  for (let i = 1; i <= Math.min(pdf.numPages, 12); i++) {
    const page = await pdf.getPage(i);
    const tc = await page.getTextContent();
    let line = '';
    tc.items.forEach(it => { line += it.str; line += it.hasEOL ? '\n' : ' '; });
    out.push(line.replace(/[ \t]+\n/g, '\n').replace(/ {2,}/g, ' '));
  }
  return out.join('\n\n').trim();
}

    const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
    await page.render({canvasContext: cv.getContext('2d'), viewport: vp}).promise;

  }

}

async function analyze(id, local){

    }
    if (!c.cvText && !images) { toast('Không có nội dung CV để phân tích. Hãy tải lại file hoặc dán nội dung.'); return; }
    if (images && !S.canImages) { toast('Chế độ xem này chưa hỗ trợ AI đọc ảnh. Hãy dán nội dung CV dạng chữ.'); return; }
    const res = await S.sample.json(buildPrompt(c, j, !!images), {signal: ctl.signal, images: images || undefined, cache: false});
    const a = normalize(res || {}, j);
    const patch = {analysis: a, score: a.score, lang: a.language, analyzedAt: Date.now(),
      translationVi: String(res.translationVi || '').slice(0, 30000)};
    if (!c.cvText && res.originalText) patch.cvText = String(res.originalText).slice(0, 20000);
    if (a.name && (c.autoName !== false)) patch.name = a.name;
    if (a.email) patch.email = a.email;
    if (a.phone) patch.phone = a.phone;
    if (c.stage === 'new') patch.stage = 'screened';
    await saveCand(id, patch);
    toast('AI đã phân tích xong CV của ' + (patch.name || c.name) + '.');
  } catch (e) {
    if (e && e.code) toast(aiErr(e)); else toast('Phân tích chưa hoàn tất. Thử lại sau.');
  } finally { delete S.running[id]; render(true); }
}

// ---------- upload ----------
async function handleFiles(files){
  if (!S.db) return toast('Chưa kết nối kho dữ liệu, chưa thể thêm CV.');
  const jobId = ($('#up-job') || {}).value || '';
  for (const file of Array.from(files)) {
    const log = {name: file.name, state:'run', msg:'Đang đọc file…'};
    S.upLog.unshift(log); S.upLog = S.upLog.slice(0, 6); render(true);
    try {
      const mime = mimeOf(file);
      let text = '', images = null;
      if (mime === 'application/pdf') {
        const pdf = await pdfDoc(file);
        text = await pdfText(pdf);
        if (text.replace(/\s/g, '').length < 80) { log.msg = 'PDF dạng ảnh, đang chuyển trang thành ảnh…'; render(true); images = await pdfImages(pdf); text = ''; }
      } else if (/wordprocessingml/.test(mime)) {
        if (!window.mammoth) throw new Error('docx');
        text = (await window.mammoth.extractRawText({arrayBuffer: await file.arrayBuffer()})).value.trim();
      } else if (mime === 'text/plain') {
        text = (await file.text()).trim();
      } else if (/^image\//.test(mime)) {
        images = [file];
      } else { throw new Error('type'); }
      let assetId = null;
      if (S.assets) {
        log.msg = 'Đang lưu file gốc…'; render(true);
        try { const up = await S.assets.upload(file, {type: mime}); assetId = up.id; } catch (e) { /* keep going without the original */ }
      }
      const ref = S.db.collection('candidates').doc();
      const doc = {name: nameFromFile(file.name), autoName: true, email:'', phone:'', jobId: jobId, stage:'new', score:null, lang:'',
        file:{name: file.name, type: mime, assetId: assetId}, cvText: text.slice(0, 20000), translationVi:'', note:'', createdAt: Date.now()};
      await ref.set(doc);
      if (images) S.imgCache[ref.id] = images;
      if (useAI()) { log.msg = 'AI đang đọc và chấm điểm CV (30–90 giây)…'; render(true); await analyze(ref.id, Object.assign({id: ref.id}, doc)); }
      log.state = 'ok'; log.msg = useAI() ? 'Đã thêm và phân tích xong' : 'Đã lưu CV. Mở CV để tự đánh giá.';
    } catch (e) {
      log.state = 'err';
      log.msg = e && e.message === 'type' ? 'Định dạng chưa hỗ trợ. Dùng PDF, DOCX, TXT hoặc ảnh.' : e && e.code ? dbErr(e) : 'Không đọc được file này. Thử dán nội dung CV.';
    }
    render(true);
  }
}

function srcPill(a){
  if (a.source === 'manual') return '<span class="pill t-info">Tự đánh giá</span>';
  if (a.source === 'ai-edited') return '<span class="pill t-purple">AI + chỉnh tay</span>';
  return '<span class="pill t-accent">' + ICON.spark + 'AI đánh giá</span>';
}

      '<div class="mini" style="flex-direction:row;align-items:baseline;gap:6px"><span>Điểm tổng</span><b id="m-total" style="font-size:22px;color:var(--accent)">' + (sc == null ? '—' : sc) + '</b><span>/ 100</span></div></div>' +
    '<div class="stack" style="gap:8px"><span class="label">Điểm theo tiêu chí (0–100)</span><div class="grid2">' +
      f('skill', 'Kỹ năng chuyên môn (' + w.skill + '%)', '0–100', 'number', ' min="0" max="100"') + f('exp', 'Kinh nghiệm (' + w.exp + '%)', '0–100', 'number', ' min="0" max="100"') +
      f('edu', 'Học vấn (' + w.edu + '%)', '0–100', 'number', ' min="0" max="100"') + f('langs', 'Ngoại ngữ (' + w.lang + '%)', '0–100', 'number', ' min="0" max="100"') + '</div></div>' +

  return '<header class="top"><div><h1>Quy trình tuyển dụng</h1><p>Theo dõi ứng viên qua từng vòng. Dùng nút mũi tên để chuyển ứng viên sang bước kế tiếp; điểm CV giúp ưu tiên trong mỗi cột.</p></div>' +

          if ((st === 'interview') && iv) { const r = (iv.r || []).slice(0, iv.rounds || 2).find(r => !r.verdict) || (iv.r || [])[0]; if (r && r.date) meta += 'Lịch ' + fmtDay(r.date) + (r.start ? ', ' + r.start : ''); else meta += 'Chưa đặt lịch'; }

function viewInterview(){
  const pool = S.cands.filter(c => ['interview','offer','hired'].includes(c.stage) || S.ivs[c.id]);
  const t0 = todayIso();
  const upcoming = [];
  pool.forEach(c => { const d = S.ivs[c.id]; if (!d) return; (d.r || []).slice(0, d.rounds || 2).forEach((r, i) => { if (r.date && r.date >= t0 && !r.verdict) upcoming.push({c, r, i}); }); });
  upcoming.sort((a, b) => (a.r.date + a.r.start).localeCompare(b.r.date + b.r.start));
  let c = cand(S.selIv); if (!c || !pool.includes(c)) { c = pool[0]; S.selIv = c ? c.id : null; }
  const head = '<header class="top"><div><h1>Phỏng vấn</h1><p>Lên lịch 1 hoặc 2 vòng phỏng vấn, ghi nhận người phỏng vấn và kết quả chi tiết từng vòng.</p></div></header>';
  if (!c) return head + '<div class="card empty">Chưa có ứng viên nào ở bước phỏng vấn. Mở một CV đạt yêu cầu và bấm <b>Mời phỏng vấn</b>, hoặc chuyển ứng viên sang cột Phỏng vấn ở <a href="#quy-trinh">Quy trình tuyển dụng</a>.</div>';
  const iv = ivOf(c.id); const n = iv.rounds || 2; let ai = S.ivRound; if (ai > n) ai = 1;
  const r = iv.r[ai - 1];
  const rated = r.scores.filter(x => x > 0);
  const avg = rated.length ? (rated.reduce((s, x) => s + x, 0) / rated.length).toFixed(1) : '—';
  const vs = iv.r.slice(0, n).map(x => x.verdict);
  let fin;
  if (vs.includes('Không đạt')) fin = ['t-bad', 'Không đạt'];
  else if (vs.includes('')) fin = ['t-info', 'Đang chờ kết quả vòng ' + (vs.indexOf('') + 1)];
  else if (vs.every(v => v === 'Đạt')) fin = ['t-accent', 'Đạt, đề xuất gửi offer'];
  else fin = ['t-warn', 'Cân nhắc, cần hội đồng thảo luận thêm'];
  return head + '<div class="iv-grid">' +
    '<aside class="stack">' +
      '<div class="card pad stack"><h2>Ứng viên phỏng vấn</h2><div class="stack iv-list" style="gap:8px">' + pool.map(x => { const d = S.ivs[x.id]; const nx = d ? (d.r || []).slice(0, d.rounds || 2).find(rr => !rr.verdict) : null;
        return '<button type="button" data-act="pick-iv" data-id="' + esc(x.id) + '" aria-pressed="' + (x.id === c.id) + '"><b>' + esc(x.name) + '</b><span class="sub">' + esc(jobTitle(x.jobId)) + '</span><span class="row" style="gap:6px">' + stagePill(x.stage) + '<span class="sub">' + (nx && nx.date ? fmtDay(nx.date) + (nx.start ? ' ' + nx.start : '') : d ? 'Đã có kết quả' : 'Chưa lên lịch') + '</span></span></button>'; }).join('') + '</div></div>' +
      '<div class="card pad stack"><h2>Lịch sắp tới</h2>' + (upcoming.length ? upcoming.slice(0, 8).map(u => '<div class="kv"><span>' + fmtDay(u.r.date) + (u.r.start ? ' · ' + esc(u.r.start) : '') + '</span><b>' + esc(u.c.name) + ' · V' + (u.i + 1) + '</b></div>').join('') : '<span class="sub">Chưa có buổi phỏng vấn nào sắp diễn ra.</span>') + '</div>' +
    '</aside>' +
    '<section class="stack" aria-label="Chi tiết phỏng vấn">' +
      '<div class="card pad row" style="gap:14px"><div class="avatar" style="width:46px;height:46px;font-size:15px">' + esc(initials(c.name)) + '</div><div class="stack" style="gap:2px;flex:1;min-width:200px"><div class="row" style="gap:8px"><b style="font-family:var(--serif);font-size:21px">' + esc(c.name) + '</b>' + (c.score != null ? '<span class="pill t-' + tone(c.score) + '">Điểm CV ' + c.score + '/100</span>' : '') + stagePill(c.stage) + '</div><span class="sub">' + esc([jobTitle(c.jobId), c.lang ? 'CV ' + (LANGS[c.lang] || LANGS.other).name.toLowerCase() + (c.lang !== 'vi' ? ' (đã dịch)' : '') : '', c.email].filter(Boolean).join(' · ')) + '</span></div>' +
        '<div class="row"><span style="font-weight:600;font-size:13px">Số vòng:</span><div class="seg" role="group" aria-label="Số vòng phỏng vấn"><button type="button" data-act="iv-n" data-v="1" aria-pressed="' + (n === 1) + '">1 vòng</button><button type="button" data-act="iv-n" data-v="2" aria-pressed="' + (n === 2) + '">2 vòng</button></div></div></div>' +

      '<div class="iv-body">' +
        '<div class="card pad stack"><h2>Lịch phỏng vấn · Vòng ' + ai + '</h2>' +

function blankJob(){ return {id:null, title:'', dept:'', loc:'', level:'', exp:'', salary:'', qty:'', deadline:'', status:'Nháp', jd:'', req:'', benefit:'', must:[], nice:[], weights:clone(DEFAULT_W)}; }

// ---------- render ----------
const VIEWS = {'ung-vien': viewCandidates, 'doc-cv': viewCV, 'quy-trinh': viewPipeline, 'phong-van': viewInterview, 'vi-tri': viewJobs};
function render(force){
  const ae = document.activeElement;
  if (!force && ae && $('#main').contains(ae) && ae.matches('input:not([type=range]):not([type=file]),textarea,select')) { S.pending = true; return; }
  S.pending = false;
  const main = $('#main');
  const keep = ae && ae.id && main.contains(ae) ? {id: ae.id, s: ae.selectionStart, e: ae.selectionEnd} : null;
  main.innerHTML = (VIEWS[S.view] || viewCandidates)();
  if (keep) { const el = document.getElementById(keep.id); if (el) { el.focus({preventScroll:true}); try { if (keep.s != null) el.setSelectionRange(keep.s, keep.e); } catch (e) {} } }
  document.querySelectorAll('[data-nav]').forEach(a => a.getAttribute('data-nav') === S.view ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  $('#n-cand').textContent = S.cands.length || '';
  $('#n-iv').textContent = S.cands.filter(c => c.stage === 'interview').length || '';
  $('#n-job').textContent = S.jobs.filter(j => j.status === 'Đang tuyển').length || '';
  bindDrop();
  remember();
}
function bindDrop(){
  const dz = $('#drop'); if (!dz) return;
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('over'));
  dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('over'); if (e.dataTransfer && e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });
}
function go(view){ if (location.hash !== '#' + view) location.hash = view; else { S.view = view; render(true); } window.scrollTo(0, 0); }
function readHash(){ const h = location.hash.replace('#', ''); S.view = VIEWS[h] ? h : 'ung-vien'; S.confirm = null; render(true); }
window.addEventListener('hashchange', readHash);
document.addEventListener('focusout', () => { if (S.pending) setTimeout(() => { const ae = document.activeElement; if (!(ae && $('#main').contains(ae) && ae.matches('input:not([type=range]),textarea,select'))) render(true); }, 0); });

// ---------- interview edits ----------
function ivEdit(fn){
  const c = cand(S.selIv); if (!c) return;
  const iv = clone(ivOf(c.id)); const n = iv.rounds || 2; let ai = S.ivRound; if (ai > n) ai = 1;
  fn(iv, iv.r[ai - 1], ai);
  saveIv(c.id, iv);
}
function inviteText(c, iv){
  const n = iv.rounds || 2;
  const lines = ['Kính gửi ' + c.name + ',', '', 'Cảm ơn bạn đã ứng tuyển vị trí ' + jobTitle(c.jobId) + '. Chúng tôi trân trọng mời bạn tham gia phỏng vấn:'];
  iv.r.slice(0, n).forEach((r, i) => {
    lines.push('', 'Vòng ' + (i + 1) + ': ' + (r.kind || ''), '- Thời gian: ' + (r.start || '[giờ]') + (r.end ? ' – ' + r.end : '') + ', ngày ' + (r.date ? fmtDay(r.date) : '[ngày]'), '- Hình thức: ' + r.mode, '- Địa điểm / link: ' + (r.place || '[địa điểm]'));
    if (r.people.length) lines.push('- Người phỏng vấn: ' + r.people.map(p => p.name + (p.role ? ' (' + p.role + ')' : '')).join(', '));
  });
  lines.push('', 'Vui lòng phản hồi email này để xác nhận tham gia.', '', 'Trân trọng,');
  return lines.join('\n');
}

// ---------- events ----------
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.getAttribute('data-act'); const id = t.getAttribute('data-id'); const v = t.getAttribute('data-v');
  if (t.tagName === 'TR' && e.target.closest('button,a')) return;
  switch (act) {
    case 'f-stage': S.f.stage = v; render(true); break;
    case 'ai-mode': if (v === 'auto' && !S.sample) { toast('Để dùng AI, hãy nhập API key Anthropic ở mục Cài đặt trước.'); go('cai-dat'); break; } S.aiMode = v; remember(); footer(); toast(v === 'manual' ? 'Đã chọn tự đánh giá: CV tải lên sẽ không được gửi cho AI.' : 'Đã cho phép AI phân tích CV tải lên.'); render(true); break;
    case 'edit-eval': { const c = cand(id); if (c) { openEval(c); render(true); const n0 = $('#m-skill'); if (n0) n0.focus(); } break; }
    case 'save-eval': saveEval(); break;
    case 'cancel-eval': S.editEval = null; S.evalDraft = null; render(true); break;
    case 'open-cv': S.selCand = id; S.cvMode = 'vi'; S.confirm = null; go('doc-cv'); break;
    case 'cv-mode': S.cvMode = v; render(true); break;
    case 'analyze': analyze(id); break;
    case 'stop-ai': if (S.running[id]) S.running[id].ctl.abort(); break;
    case 'paste-cv': addPasted(); break;
    case 'ask-del': S.confirm = 'del-' + id; render(true); break;
    case 'cancel-confirm': S.confirm = null; render(true); break;
    case 'del-cand': {
      const c = cand(id); S.confirm = null;
      try {
        await S.db.doc('candidates/' + id).delete();
        if (S.ivs[id]) await S.db.doc('interviews/' + id).delete();
        if (c && c.file && c.file.assetId && S.assets) { try { await S.assets.delete(c.file.assetId); } catch (err) {} }
        S.selCand = null; toast('Đã xóa hồ sơ ' + (c ? c.name : '') + '.');
      } catch (err) { toast(dbErr(err)); }
      break;
    }
    case 'invite': {
      const c = cand(id); if (!c) break;
      if (!S.ivs[id]) await saveIv(id, ivOf(id));
      if (!['interview','offer','hired'].includes(c.stage)) await saveCand(id, {stage:'interview'});
      S.selIv = id; S.ivRound = 1; go('phong-van'); break;
    }
    case 'dl-tr': {
      const c = cand(id);
      try { await S.downloads.save({filename: 'CV_' + String(c.name).replace(/\s+/g, '_') + '_tieng_Viet.txt', data: c.translationVi}); toast('Đã lưu bản dịch.'); }
      catch (err) { if (err && err.code !== 'declined') toast('Chưa tải được file. Thử lại sau.'); }
      break;
    }
    case 'export-csv': {
      
      const q = s => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
      const rows = [['Họ tên','Email','Điện thoại','Vị trí','Điểm AI','Ngôn ngữ CV','Trạng thái','Ngày nộp','Kỹ năng','Ghi chú']].concat(S.cands.map(c => [c.name, c.email, c.phone, jobTitle(c.jobId), c.score == null ? '' : c.score, c.lang ? (LANGS[c.lang] || LANGS.other).name : '', (STAGE[c.stage] || STAGE.new).label, fmtDate(c.createdAt), (c.analysis && c.analysis.skills || []).join(', '), c.note || '']));
      try { await S.downloads.save({filename:'danh_sach_ung_vien.csv', data:'\ufeff' + rows.map(r => r.map(q).join(',')).join('\r\n')}); toast('Đã xuất danh sách.'); }
      catch (err) { if (err && err.code !== 'declined') toast('Chưa xuất được file. Thử lại sau.'); }
      break;
    }
    case 'clear-sample': {
      S.confirm = null;
      const cs = S.cands.filter(c => c.sample), js = S.jobs.filter(j => j.sample);
      try { for (const c of cs) { await S.db.doc('candidates/' + c.id).delete(); if (S.ivs[c.id]) await S.db.doc('interviews/' + c.id).delete(); } for (const j of js) await S.db.doc('jobs/' + j.id).delete(); toast('Đã xóa dữ liệu mẫu.'); }
      catch (err) { toast(dbErr(err)); }
      break;
    }
    case 'move': {
      const c = cand(id); if (!c) break;
      await saveCand(id, {stage: v});
      toast(c.name + ': ' + STAGE[v].label + '.');
      if (v === 'interview' && !S.ivs[id]) saveIv(id, ivOf(id));
      break;
    }
    case 'show-rejected': S.f.stage = 'rejected'; break;
    case 'pick-iv': S.selIv = id; S.ivRound = 1; render(true); break;
    case 'iv-n': ivEdit(iv => { iv.rounds = Number(v); if (Number(v) === 1) iv.r[0].kind = iv.r[0].kind === 'Phỏng vấn chuyên môn' ? 'Phỏng vấn chuyên môn & quản lý' : iv.r[0].kind; }); if (S.ivRound > Number(v)) S.ivRound = 1; render(true); break;
    case 'iv-round': S.ivRound = Number(v); render(true); break;
    case 'iv-score': ivEdit((iv, r) => { const i = Number(t.getAttribute('data-i')); r.scores[i] = r.scores[i] === Number(v) ? 0 : Number(v); }); render(true); break;
    case 'iv-verdict': ivEdit((iv, r) => { r.verdict = r.verdict === v ? '' : v; }); render(true); break;
    case 'iv-add-person': {
      const nm = ($('#iv-pname').value || '').trim(); const rl = ($('#iv-prole').value || '').trim();
      if (!nm) { toast('Nhập họ tên người phỏng vấn.'); $('#iv-pname').focus(); break; }

// ---------- local storage on this device (IndexedDB) ----------
const IDB = {
  db: null,
  open(){ return new Promise((res, rej) => { const r = indexedDB.open('hr-recruitment', 1); r.onupgradeneeded = () => { r.result.createObjectStore('docs'); r.result.createObjectStore('files'); }; r.onsuccess = () => { IDB.db = r.result; res(); }; r.onerror = () => rej(r.error); }); },
  write(store, fn){ return new Promise((res, rej) => { const t = IDB.db.transaction(store, 'readwrite'); fn(t.objectStore(store)); t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); },
  get(store, key){ return new Promise(res => { const r = IDB.db.transaction(store).objectStore(store).get(key); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); }); },
  all(store){ return new Promise((res, rej) => { const out = []; const c = IDB.db.transaction(store).objectStore(store).openCursor(); c.onsuccess = () => { const cur = c.result; if (cur) { out.push([cur.key, cur.value]); cur.continue(); } else res(out); }; c.onerror = () => rej(c.error); }); }
};
function makeLocalDB(initial){
  const data = {};
  initial.forEach(kv => { data[kv[0]] = kv[1]; });
  const subs = {};
  const snapOf = coll => { const docs = Object.keys(data).filter(k => k.split('/')[0] === coll).map(k => { const body = data[k]; return {id: k.split('/')[1], exists: true, data: () => body}; }); return {docs: docs, size: docs.length, empty: !docs.length}; };
  const emit = coll => (subs[coll] || []).forEach(fn => { try { fn(snapOf(coll)); } catch (e) { console.error(e); } });
  const persist = (path, body) => IDB.write('docs', s => { if (body === undefined) s.delete(path); else s.put(body, path); }).catch(e => { toast('Không lưu được dữ liệu: bộ nhớ trình duyệt có thể đã đầy. Hãy sao lưu và xóa bớt hồ sơ cũ.'); throw {code: 'quota_exceeded'}; });
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  function docRef(path){
    const coll = path.split('/')[0], id = path.split('/')[1];
    return {id: id, path: path,
      async get(){ const b = data[path]; return {id: id, exists: !!b, data: () => b}; },
      async set(body){ data[path] = clone(body); emit(coll); await persist(path, data[path]); },
      async update(patch){ if (!data[path]) throw {code: 'invalid_argument'}; data[path] = Object.assign({}, data[path], clone(patch)); emit(coll); await persist(path, data[path]); },
      async delete(){ delete data[path]; emit(coll); await persist(path, undefined); }
    };
  }
  return {
    doc: docRef,
    collection(coll){ return {
      doc(id){ return docRef(coll + '/' + (id || newId())); },
      onSnapshot(fn){ (subs[coll] = subs[coll] || []).push(fn); setTimeout(() => fn(snapOf(coll)), 0); return () => { subs[coll] = subs[coll].filter(f => f !== fn); }; }
    }; },
    dump(){ return clone(data); },
    count(coll){ return Object.keys(data).filter(k => k.split('/')[0] === coll).length; },
    isEmpty(){ return !Object.keys(data).length; },
    async replaceAll(obj){
      Object.keys(data).forEach(k => delete data[k]);
      Object.keys(obj).forEach(k => { if (/^(jobs|candidates|interviews)\/[^/]+$/.test(k) && obj[k] && typeof obj[k] === 'object') data[k] = obj[k]; });
      await IDB.write('docs', s => { s.clear(); Object.keys(data).forEach(k => s.put(data[k], k)); });
      ['jobs', 'candidates', 'interviews'].forEach(emit);
    }
  };
}
const LocalFiles = {
  async upload(file){ const id = 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); await IDB.write('files', s => s.put(file, id)); return {id: id}; },
  get(id){ return IDB.get('files', id); },
  async delete(id){ await IDB.write('files', s => s.delete(id)); return {deleted: true}; }
};
const LocalDownloads = {
  async save(o){
    const ext = (o.filename.split('.').pop() || '').toLowerCase();
    const type = {csv: 'text/csv;charset=utf-8', json: 'application/json', txt: 'text/plain;charset=utf-8'}[ext] || 'application/octet-stream';
    const blob = o.data instanceof Blob ? o.data : new Blob([o.data], {type: type});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = o.filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    return {status: 'saved'};
  }
};

// ---------- AI through the user's own Anthropic API key ----------
const AI_KEY = 'hr-recruitment-ai';
const MODELS = [['claude-sonnet-5', 'Claude Sonnet 5 (cân bằng, nên dùng)'], ['claude-haiku-4-5-20251001', 'Claude Haiku 4.5 (nhanh, rẻ nhất)'], ['claude-opus-5-5', 'Claude Opus 5.5 (mạnh nhất, đắt nhất)']];
function loadAI(){ try { return JSON.parse(localStorage.getItem(AI_KEY) || '{}'); } catch (e) { return {}; } }
function saveAIcfg(cfg){ try { localStorage.setItem(AI_KEY, JSON.stringify(cfg)); } catch (e) { toast('Trình duyệt không cho lưu cài đặt.'); } }
function parseJSON(t){
  try { return JSON.parse(t); } catch (e) {}
  const f = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (f) { try { return JSON.parse(f[1]); } catch (e) {} }
  const a = t.search(/[\[{]/), b = Math.max(t.lastIndexOf('}'), t.lastIndexOf(']'));
  if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch (e) {} }
  throw {code: 'invalid_json', text: t};
}
function makeAI(cfg){
  if (!cfg || !cfg.key) return null;
  const toB64 = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(b); });
  async function call(prompt, opts){
    const content = [];
    for (const img of (opts.images || [])) {
      const mt = /^image\/(png|jpeg|webp|gif)$/.test(img.type || '') ? img.type : 'image/png';
      content.push({type: 'image', source: {type: 'base64', media_type: mt, data: await toB64(img)}});
    }
    content.push({type: 'text', text: prompt + '\n\nChỉ trả lời bằng một giá trị JSON hợp lệ, không thêm chữ nào khác.'});
    let r;
    try {
      r = await fetch('https://api.anthropic.com/v1/messages', {method: 'POST', signal: opts.signal,
        headers: {'content-type': 'application/json', 'x-api-key': cfg.key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true'},
        body: JSON.stringify({model: cfg.model || MODELS[0][0], max_tokens: 16000, messages: [{role: 'user', content: content}]})});
    } catch (e) { if (e && e.name === 'AbortError') throw {code: 'cancelled'}; throw {code: 'network'}; }
    if (!r.ok) {
      let msg = ''; try { msg = (await r.json()).error.message; } catch (e) {}
      const code = r.status === 401 || r.status === 403 ? 'auth' : r.status === 429 ? 'rate_limited' : r.status === 529 || r.status === 503 ? 'overloaded' : r.status === 413 ? 'prompt_too_large' : r.status === 404 ? 'model' : r.status === 400 && /credit|billing/i.test(msg) ? 'billing' : 'upstream_error';
      throw {code: code, message: msg};
    }
    const j = await r.json();
    return (j.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
  }
  return {
    async json(prompt, opts){ return parseJSON(await call(prompt, opts || {})); },
    async test(){ return parseJSON(await call('Trả lời đúng: {"ok": true}', {})); }
  };
}
const baseAiErr = aiErr;
aiErr = function(e){
  const c = e && e.code;
  if (c === 'auth') return 'API key không đúng hoặc đã bị thu hồi. Kiểm tra lại ở Cài đặt.';
  if (c === 'billing') return 'Tài khoản API hết tín dụng. Nạp thêm tại console.anthropic.com.';
  if (c === 'network') return 'Không kết nối được máy chủ AI. Kiểm tra mạng rồi thử lại.';
  if (c === 'overloaded') return 'Máy chủ AI đang quá tải. Thử lại sau ít phút.';
  if (c === 'model') return 'Mô hình AI đã chọn không dùng được với key này. Chọn mô hình khác ở Cài đặt.';
  return baseAiErr(e);
};
